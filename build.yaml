# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: settings_reset

  - board: seeeduino_xiao_ble
    shield: corne_dongle dongle_screen
  - board: seeeduino_xiao_ble
    shield: corne_dongle dongle_screen
    snippet: zmk-usb-logging
    artifact-name: corne_dongle_logging
    cmake-args: -DCONFIG_THREAD_NAME=y -DCONFIG_THREAD_ANALYZER=y -DCONFIG_THREAD_ANALYZER_USE_LOG=y -DCONFIG_THREAD_ANALYZER_AUTO=y -DCONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60 -DCONFIG_HW_STACK_PROTECTION=y
  - board: seeeduino_xiao_ble
    shield: settings_reset
